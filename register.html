<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Student Expense Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Remixicon for clean icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-icon">
        <i class="ri-user-add-line"></i>
      </div>
      <h1>Create Account</h1>
      <p>Sign up to start tracking your student expenses</p>
    </div>

    <!-- Error Message Alert (Shown on validation/API failure) -->
    <div id="regErrorMessage" class="auth-alert auth-alert-danger" style="display: none;">
      <i class="ri-error-warning-line"></i>
      <span id="regErrorText">An error occurred. Please try again.</span>
    </div>

    <!-- Success Message Alert (Shown after successful registration) -->
    <div id="regSuccessMessage" class="auth-alert auth-alert-success" style="display: none;">
      <i class="ri-checkbox-circle-line"></i>
      <span id="regSuccessText">Registration successful! Redirecting to login...</span>
    </div>

    <form id="registerForm">

      <!-- Full Name -->
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="regName">Full Name</label>
        <input
          type="text"
          id="regName"
          class="form-control"
          placeholder="e.g. Karunesh DS"
          required
        >
      </div>

      <!-- Email -->
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="regEmail">Student Email ID</label>
        <input
          type="email"
          id="regEmail"
          class="form-control"
          placeholder="e.g. student@example.com"
          required
        >
      </div>

      <!-- Password -->
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="regPassword">Password <small style="color: var(--text-muted);">(min. 6 characters)</small></label>
        <input
          type="password"
          id="regPassword"
          class="form-control"
          placeholder="Enter a strong password"
          required
        >
      </div>

      <!-- Confirm Password -->
      <div class="form-group" style="margin-bottom: 24px;">
        <label for="regConfirmPassword">Confirm Password</label>
        <input
          type="password"
          id="regConfirmPassword"
          class="form-control"
          placeholder="Re-enter your password"
          required
        >
      </div>

      <button type="submit" id="registerBtn" class="btn btn-primary" style="width: 100%; padding: 12px;">
        <i class="ri-user-add-line"></i> Create Account
      </button>
    </form>

    <div style="text-align: center; margin-top: 20px; font-size: 0.88rem; color: var(--text-muted);">
      <p>Already have an account? <a href="index.html" style="color: var(--primary); font-weight: 600;">Login here</a></p>
    </div>

    <div style="text-align: center; margin-top: 12px; font-size: 0.82rem; color: var(--text-muted);">
      <p>BCA Final Year Academic Project</p>
    </div>
  </div>

  <!-- Scripts: data.js for API_BASE_URL, register.js for registration logic -->
  <script src="js/data.js"></script>
  <script src="js/register.js"></script>
</body>
</html>
