<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Student Expense Management System</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Remixicon for clean icons -->
  <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="auth-body">

  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-icon">
        <i class="ri-wallet-3-line"></i>
      </div>
      <h1>Student Expense Tracker</h1>
      <p>Manage your daily student allowance & expenses easily</p>
    </div>

    <!-- Demo Credentials Info Banner -->
    <div class="auth-alert">
      <i class="ri-information-line"></i>
      <div>
        <strong>Demo Login:</strong><br>
        Email: <code>student@example.com</code><br>
        Password: <code>student123</code>
      </div>
    </div>

    <!-- Dynamic Error Message Alert (Shown when credentials fail) -->
    <div id="errorMessage" class="auth-alert auth-alert-danger" style="display: none;">
      <i class="ri-error-warning-line"></i>
      <span id="errorText">Invalid credentials. Please try again.</span>
    </div>

    <form id="loginForm">
      <div class="form-group" style="margin-bottom: 16px;">
        <label for="email">Student Email ID</label>
        <input 
          type="email" 
          id="email" 
          class="form-control" 
          placeholder="student@example.com" 
          value="student@example.com" 
          required
        >
      </div>

      <div class="form-group" style="margin-bottom: 24px;">
        <label for="password">Password</label>
        <input 
          type="password" 
          id="password" 
          class="form-control" 
          placeholder="student123" 
          value="student123" 
          required
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; padding: 12px;">
        <i class="ri-login-box-line"></i> Sign In to Dashboard
      </button>
    </form>

    <div style="text-align: center; margin-top: 24px; font-size: 0.82rem; color: var(--text-muted);">
      <p>BCA Final Year Academic Project</p>
      <p style="margin-top: 8px;">Don't have an account? <a href="register.html" style="color: var(--primary); font-weight: 600;">Register here</a></p>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const submitBtn = this.querySelector('button[type="submit"]');
      const errorContainer = document.getElementById('errorMessage');
      const errorText = document.getElementById('errorText');

      const email = emailInput.value.trim();
      const password = passwordInput.value.trim();

      // UI Loading state
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="ri-loader-4-line"></i> Signing In...';
      errorContainer.style.display = 'none';

      try {
        // Attempt backend login via auth.js
        const result = await login(email, password);

        if (result.success) {
          // Redirect to dashboard on success
          window.location.href = 'dashboard.html';
        } else {
          // Show error message and stay on login page
          errorText.textContent = result.message;
          errorContainer.style.display = 'flex';
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<i class="ri-login-box-line"></i> Sign In to Dashboard';
        }
      } catch (err) {
        console.error('Login submit error:', err);
        errorText.textContent = err.message || 'An unexpected error occurred. Please make sure the Flask backend is running at http://127.0.0.1:5000.';
        errorContainer.style.display = 'flex';
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<i class="ri-login-box-line"></i> Sign In to Dashboard';
      }
    });
  </script>
</body>
</html>
